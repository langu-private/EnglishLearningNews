name: Evening Podcast Generation
# Last schedule update: 2026-06-12

on:
  schedule:
    - cron: "45 10 * * *"  # 10:45 UTC = 18:45 Beijing Time
  workflow_dispatch:      # Allows manual trigger from the GitHub Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser openai edge-tts feedgen pytz google-genai

      - name: Install System Dependencies (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Evening Podcast Generation
        env:
          API_KEY: ${{ secrets.LLM_API_KEY }}
          BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai/"
        run: |
          python generate_podcast.py --edition Evening --api-key "$API_KEY" --base-url "$BASE_URL" --model "gemini-3.1-flash-lite" --github-url "https://langu-private.github.io/EnglishLearningNews"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-generate Evening Podcast [skip ci]" || echo "No changes to commit"
          git pull --rebase -X theirs origin main
          git push
