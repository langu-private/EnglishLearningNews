name: Morning Podcast Generation

on:
  schedule:
    - cron: "0 23 * * *"  # 23:00 UTC corresponds to 07:00 Beijing Time the next day
  workflow_dispatch:      # Allows manual trigger from the GitHub Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser openai edge-tts feedgen pytz

      - name: Run Morning Podcast Generation
        env:
          API_KEY: ${{ secrets.GEMINI }}
          BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai/"
        run: |
          python generate_podcast.py --edition Morning --api-key "$API_KEY" --base-url "$BASE_URL" --model "gemini-3.1-pro" --github-url "https://langu-private.github.io/EnglishLearningNews"

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-generate Morning Podcast [skip ci]" || echo "No changes to commit"
          git push
